name: 编译 SoundBox APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 发布 Release 时需要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装编译所需 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Release APK
        env:
          # 仓库内已自带固定签名密钥，保证每次编译出的 APK 可覆盖升级
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SoundBox-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 推送 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: SoundBox ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
